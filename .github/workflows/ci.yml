name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      VITE_AUTH0_DOMAIN: ci.invalid
      VITE_AUTH0_CLIENT_ID: ci-client
      VITE_AUTH0_AUDIENCE: https://api.invalid
      VITE_API_BASE_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm check:packages
      - run: pnpm knip
        env:
          DATABASE_URL: postgres://opulent:opulent@localhost:5432/opulent_tutor
      - run: pnpm infra:synth
      - run: pnpm --filter @opulent/infra run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine@sha256:47e961a569fd52ff31f0fe205ed91eeab17d9f5fff6722e6d7ea6b588748b293
        env:
          POSTGRES_USER: opulent
          POSTGRES_PASSWORD: opulent
          POSTGRES_DB: opulent_tutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opulent -d opulent_tutor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://opulent:opulent@localhost:5432/opulent_tutor
      AUTH0_DOMAIN: ci.invalid
      AUTH0_AUDIENCE: https://api.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:bootstrap
      - run: pnpm db:migrate
      - run: pnpm db:bootstrap
      - run: pnpm db:drift
      - run: pnpm smoke

  e2e:
    name: Browser smoke
    # Set the RUN_BROWSER_SMOKE repository variable to true to run this job.
    if: ${{ vars.RUN_BROWSER_SMOKE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_AUTH0_DOMAIN: ${{ vars.E2E_AUTH0_DOMAIN || 'ci.invalid' }}
      VITE_AUTH0_CLIENT_ID: ${{ vars.E2E_AUTH0_CLIENT_ID || 'ci-client' }}
      VITE_AUTH0_AUDIENCE: ${{ vars.E2E_AUTH0_AUDIENCE || 'https://api.invalid' }}
      VITE_API_BASE_URL: http://127.0.0.1:8787
      E2E_AUTH0_EMAIL: ${{ secrets.E2E_AUTH0_EMAIL }}
      E2E_AUTH0_PASSWORD: ${{ secrets.E2E_AUTH0_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
