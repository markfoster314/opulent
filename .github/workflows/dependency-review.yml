name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Dependency Review
    # Set the RUN_DEPENDENCY_REVIEW repository variable to true to run this job.
    if: ${{ vars.RUN_DEPENDENCY_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
