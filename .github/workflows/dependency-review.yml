name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Dependency Review
    # Set the RUN_DEPENDENCY_REVIEW repository variable to true to run this job.
    if: ${{ vars.RUN_DEPENDENCY_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
