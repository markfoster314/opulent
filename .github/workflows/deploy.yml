name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      VITE_AUTH0_DOMAIN: ci.invalid
      VITE_AUTH0_CLIENT_ID: ci-client
      VITE_AUTH0_AUDIENCE: https://api.invalid
      VITE_API_BASE_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"
      - run: pnpm build
      - name: Deploy
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.account.outputs.id }}
          CDK_DEFAULT_REGION: us-east-1
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
        run: |
          args=(
            --require-approval never
            --context stage=prod
            --context "auth0Domain=${AUTH0_DOMAIN}"
            --context "auth0Audience=${AUTH0_AUDIENCE}"
            --context "auth0ClientId=${AUTH0_CLIENT_ID}"
            --context "corsOrigin=${CORS_ORIGIN}"
            --context "webOrigin=${WEB_ORIGIN}"
            --context "emailFrom=${EMAIL_FROM}"
            --context "resendApiKey=${RESEND_API_KEY}"
          )
          if [ -n "${ALARM_EMAIL}" ]; then
            args+=(--context "alarmEmail=${ALARM_EMAIL}")
          fi
          pnpm --filter @opulent/infra run deploy -- "${args[@]}"
